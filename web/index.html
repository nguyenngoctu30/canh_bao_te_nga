<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fall Detection — Web UI (Static)</title>
  <script src="/config.js"></script>
  <script>
    (function(){
      const base = window.API_BASE || '';
      const key = window.API_KEY || '';
      const origFetch = window.fetch.bind(window);
      window.fetch = function(input, init){
        if(typeof input === 'string' && input.startsWith('/')){
          input = base + input;
          init = init || {};
          init.headers = init.headers || {};
          if(key){ init.headers['X-API-KEY'] = key; }
        }
        return origFetch(input, init);
      };
      window.addEventListener('DOMContentLoaded', ()=>{
        const cam = document.getElementById('cam');
        if(cam){
          cam.src = (base||'') + '/video_feed' + (key?('?api_key='+encodeURIComponent(key)): '');
        }
      });
    })();
  </script>
  <style>
    body{font-family:Inter,system-ui,Arial,sans-serif;background:#0a0d12;color:#fff;}
    .video-wrap{max-width:960px;margin:24px auto}
    #cam{width:100%;height:auto;background:#000}
  </style>
</head>
<body>
  <div class="video-wrap">
    <img id="cam" src="/video_feed" alt="Camera feed">
  </div>
  <div style="max-width:960px;margin:0 auto;padding:12px;">
    <button onclick="location.href='/login'">Login</button>
    <p>This static frontend forwards API calls to the configured <code>API_BASE</code>.</p>
    <div style="margin-top:8px;padding:8px;background:#071022;border-radius:6px;">
      <label style="display:block;margin-bottom:6px;font-size:14px">Backend URL (API_BASE):</label>
      <input id="api_base_input" type="text" style="width:70%" placeholder="https://your-backend.example.com" />
      <button id="api_base_set">Set & Save</button>
      <button id="api_base_clear">Clear</button>
      <div id="api_base_current" style="margin-top:8px;font-size:13px;color:#9cc" />
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      const inp = document.getElementById('api_base_input');
      const btn = document.getElementById('api_base_set');
      const clr = document.getElementById('api_base_clear');
      const cur = document.getElementById('api_base_current');
      const show = () => { cur.textContent = 'Current API_BASE: ' + (window.API_BASE || '(unset)'); };
      show();
      btn.addEventListener('click', ()=>{
        const v = inp.value.trim(); if(!v) return alert('Enter URL');
        window.setApiBase(v);
        show();
        location.reload();
      });
      clr.addEventListener('click', ()=>{
        window.clearApiBase(); show(); location.reload();
      });
    });
  </script>
</body>
</html>
